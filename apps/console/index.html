<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>INTENTLOCK</title>
    <!--
      Theme, before the first paint. This runs synchronously in <head> so the correct
      surface is already on the document when the browser paints — a flash of the wrong
      theme on stage reads as a bug, and the fix is eight lines, not a library.
      The stored choice wins; absent a choice we follow the OS.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("intentlock-theme");
          var dark = stored === "dark" || (stored !== "light"
            && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) { /* storage blocked: light is the documented default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
